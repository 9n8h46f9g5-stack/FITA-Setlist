<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Fire In The Attic &#8211; Setlist Builder</title>
<style>
:root{--bg:#f6f6f6;--sf:#fff;--sf2:#f0f0f0;--bd:#e0e0e0;--bd2:#ccc;--tx:#1a1a1a;--tx2:#555;--tx3:#999;--ac:#c0392b;--sbg:#eafaf1;--sbd:#27ae60;--stx:#1e8449;--wbg:#fef9e7;--wtx:#b7770d;--dbg:#fdf0ee;--dbd:#e74c3c;--dtx:#c0392b;--ibg:#eaf4fd;--ibd:#2e86c1;--itx:#1a5276;--r:8px;--rs:5px}
@media(prefers-color-scheme:dark){:root{--bg:#111;--sf:#1c1c1c;--sf2:#252525;--bd:#2e2e2e;--bd2:#3a3a3a;--tx:#f0f0f0;--tx2:#aaa;--tx3:#666;--sbg:#0d2a0d;--sbd:#27ae60;--stx:#2ecc71;--wbg:#2a1e00;--wtx:#f0a500;--dbg:#2a0a0a;--dbd:#e74c3c;--dtx:#e74c3c;--ibg:#0d1e2e;--ibd:#2e86c1;--itx:#4a9eff}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px}
.app{display:grid;grid-template-columns:1fr 1fr;height:100vh;overflow:hidden}
.panel{display:flex;flex-direction:column;overflow:hidden;background:var(--sf)}
.pl{border-right:1px solid var(--bd)}
.ph{padding:12px 14px;background:var(--sf2);border-bottom:1px solid var(--bd);flex-shrink:0}
.ptitle{font-size:14px;font-weight:700}
.psub{font-size:11px;color:var(--tx3);margin-top:2px}
.trow{display:flex;align-items:center;gap:10px;margin-top:8px}
.tval{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.tval.over{color:var(--dtx)}
.tbadge{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--dbg);color:var(--dtx);border:1px solid var(--dbd);display:none}
.tbadge.show{display:inline-block}
.sdrow{display:flex;align-items:center;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid var(--bd)}
.sdlbl{font-size:11px;color:var(--tx2);white-space:nowrap}
.sdinp{width:66px;padding:3px 8px;border:1px solid var(--bd2);border-radius:var(--rs);background:var(--sf);color:var(--tx);font-size:12px;text-align:center}
.sdinp:focus{outline:none;border-color:var(--ibd)}
.sdwrap{flex:1;height:6px;background:var(--sf2);border-radius:20px;overflow:hidden;border:1px solid var(--bd)}
.sdbar{height:100%;border-radius:20px;background:var(--sbd);transition:width .3s,background .3s}
.sdbar.warn{background:#f0a500}.sdbar.over{background:var(--dbd)}
.sdpct{font-size:11px;min-width:34px;text-align:right;color:var(--tx2)}
.scroll{overflow-y:auto;flex:1;padding:6px 8px}
.scroll::-webkit-scrollbar{width:4px}
.scroll::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px}
.ag{margin-bottom:2px}
.ah{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 11px;border-left:3px solid var(--ac);background:var(--sf);cursor:pointer;user-select:none;position:sticky;top:0;z-index:2}
.ah:hover{background:var(--sf2)}
.ai{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.an{font-size:12px;font-weight:700;color:var(--tx)}
.ay{font-size:10px;color:var(--tx3)}
.ac2{font-size:10px;color:var(--tx3);background:var(--sf2);padding:1px 6px;border-radius:20px;border:1px solid var(--bd);align-self:flex-start}
.ac2.hs{background:var(--sbg);color:var(--stx);border-color:var(--sbd)}
.achev{font-size:12px;color:var(--tx3);flex-shrink:0}
.at{display:none;padding:2px 0 4px}.at.open{display:block}
.si{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:var(--rs);cursor:pointer;border:1px solid transparent;margin:1px 0;user-select:none}
.si:hover{background:var(--sf2)}
.si.sel{background:var(--sbg);border-color:var(--sbd)}
.si.sel .sttlc{color:var(--stx)}
.sttlc{font-size:12px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.smeta{display:flex;align-items:center;gap:4px;flex-shrink:0}
.sdur-c{font-size:11px;color:var(--tx3);padding:1px 4px;border-radius:3px;cursor:pointer;min-width:32px;text-align:center;font-variant-numeric:tabular-nums}
.sdur-c:hover{background:var(--ibg);color:var(--itx)}
.stune-c{font-size:10px;padding:1px 5px;border-radius:20px;cursor:pointer;min-width:56px;text-align:center}
.stune-c:hover{opacity:.75}
.abtn{width:18px;height:18px;border-radius:50%;border:1px solid var(--bd2);background:var(--sf2);color:var(--tx2);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.si:hover .abtn{background:var(--ibg);color:var(--itx);border-color:var(--ibd)}
.si.sel .abtn{background:var(--dbg);color:var(--dtx);border-color:var(--dbd)}
.stdd{background:var(--sf2);color:var(--tx3)}
.tdrop{background:var(--wbg);color:var(--wtx)}
.tdass{background:var(--dbg);color:var(--dtx)}
.setarea{flex:1;overflow-y:auto;padding:8px}
.setarea::-webkit-scrollbar{width:4px}
.setarea::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--tx3);font-size:13px;gap:8px}
.sitem{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:var(--rs);background:var(--sf);border:1px solid var(--bd);margin:2px 0;cursor:grab}
.sitem:hover{border-color:var(--bd2)}.sitem.dragging{opacity:.3}
.sitem.dot{border-top:2px solid var(--ibd)}.sitem.dob{border-bottom:2px solid var(--ibd)}
.snum{font-size:11px;color:var(--tx3);width:16px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
.gh{color:var(--tx3);font-size:14px;flex-shrink:0}
.sttl{font-size:12px;flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rtbadge{font-size:10px;padding:1px 5px;border-radius:20px;background:var(--wbg);color:var(--wtx);flex-shrink:0}
.stune-s{font-size:10px;padding:1px 5px;border-radius:20px;flex-shrink:0}
.sdur-s{font-size:11px;color:var(--tx2);font-variant-numeric:tabular-nums;flex-shrink:0;cursor:pointer;padding:2px 5px;border-radius:4px;width:34px;text-align:center}
.sdur-s:hover{background:var(--ibg);color:var(--itx)}
.srm{width:16px;height:16px;border-radius:50%;border:none;background:transparent;color:var(--tx3);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.srm:hover{color:var(--dtx)}
.bi{display:flex;align-items:center;gap:7px;margin:5px 0;cursor:grab;padding:4px 6px;border-radius:var(--rs);border:1px solid transparent}
.bi:hover{background:var(--sf2);border-color:var(--bd)}.bi.dragging{opacity:.3}
.bi.dot{border-top:2px solid var(--ibd)}.bi.dob{border-bottom:2px solid var(--ibd)}
.bline{flex:1;height:1px;background:var(--bd2)}
.blabel{font-size:11px;color:var(--tx2);padding:2px 10px;border-radius:20px;border:1px solid var(--bd2);background:var(--sf2);cursor:pointer;white-space:nowrap}
.blabel:hover{border-color:var(--tx2)}
.bpause{font-size:10px;color:var(--tx3);cursor:pointer;padding:2px 6px;border-radius:4px}
.bpause:hover{background:var(--sf2)}
.bgh{color:var(--tx3);font-size:14px;flex-shrink:0}
.tbar{padding:8px 12px;border-top:1px solid var(--bd);display:flex;gap:6px;flex-shrink:0;background:var(--sf2)}
.sbar{padding:8px 12px;border-top:1px solid var(--bd);display:flex;gap:6px;align-items:center;flex-shrink:0;background:var(--sf2)}
.lbar{padding:8px 12px;border-top:1px solid var(--bd);flex-shrink:0;background:var(--sf2)}
.tbtn{font-size:12px;padding:6px 10px;border:1px solid var(--bd2);border-radius:var(--rs);background:var(--sf);color:var(--tx);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.tbtn:hover{background:var(--sf2)}.tbtn.f1{flex:1;justify-content:center}
.tbtn.acc{border-color:var(--ibd);color:var(--itx);background:var(--ibg)}
.tbtn.wide{width:100%;justify-content:center}
.selver{font-size:12px;padding:5px 8px;border:1px solid var(--bd2);border-radius:var(--rs);background:var(--sf);color:var(--tx);cursor:pointer;max-width:140px}
.verlbl{font-size:11px;color:var(--tx2);flex-shrink:0}
.mob{display:none;flex-direction:column;height:100dvh}
.mhdr{padding:10px 14px;background:var(--sf2);border-bottom:1px solid var(--bd);flex-shrink:0}
.mtop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mtabs{display:flex;gap:5px;margin-top:8px}
.mtab{flex:1;padding:7px;border:1px solid var(--bd2);border-radius:var(--rs);background:transparent;color:var(--tx2);font-size:12px;font-weight:500;cursor:pointer;text-align:center;display:flex;align-items:center;justify-content:center;gap:5px}
.mtab.active{background:var(--sf);color:var(--tx);border-color:var(--tx2)}
.mpanel{flex:1;overflow:hidden;display:flex;flex-direction:column}
.mpane{display:none;flex:1;flex-direction:column;overflow:hidden}
.mpane.active{display:flex}
.modalbg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:200}
.modal{background:var(--sf);border:1px solid var(--bd2);border-radius:var(--r);padding:20px;min-width:270px;max-width:340px;width:92%}
.modal h3{font-size:14px;font-weight:600;margin-bottom:14px}
.modal label{font-size:11px;color:var(--tx2);display:block;margin-bottom:4px}
.modal input,.modal select{width:100%;padding:7px 10px;border:1px solid var(--bd2);border-radius:var(--rs);background:var(--sf);color:var(--tx);font-size:13px;margin-bottom:10px}
.modal input:focus,.modal select:focus{outline:none;border-color:var(--ibd)}
.mbtns{display:flex;gap:8px;justify-content:flex-end}
.mbtn{font-size:12px;padding:6px 14px;border:1px solid var(--bd2);border-radius:var(--rs);background:var(--sf2);color:var(--tx);cursor:pointer}
.mbtn.ok{border-color:var(--ibd);color:var(--itx);background:var(--ibg)}
@media(max-width:640px){.app{display:none}.mob{display:flex}}
</style>
</head>
<body>
<div class="app">
  <div class="panel pl">
    <div class="ph"><div class="ptitle">FIRE IN THE ATTIC &#8211; Song catalogue</div><div class="psub">Click to add &#183; click dur/tuning to edit</div></div>
    <div class="scroll" id="cat-d"></div>
    <div class="lbar"><button class="tbtn wide" onclick="openAddSong()">+ Add custom song</button></div>
  </div>
  <div class="panel">
    <div class="ph">
      <div class="ptitle" id="setlist-title">Setlist</div>
      <div class="trow"><span class="tval" id="tv-d">0:00</span><span class="tbadge" id="tbadge-d">over set duration</span></div>
      <div class="sdrow">
        <span class="sdlbl">Set duration</span>
        <input class="sdinp" id="sd-d" type="text" value="90:00" oninput="updateTimer()"/>
        <div class="sdwrap"><div class="sdbar" id="sdb-d" style="width:0%"></div></div>
        <span class="sdpct" id="sdp-d">0%</span>
      </div>
    </div>
    <div class="setarea" id="set-d"></div>
    <div class="tbar">
      <button class="tbtn f1" onclick="addBlock()">&#9654; Break</button>
      <button class="tbtn f1 acc" onclick="exportPDF()">&#128438; PDF</button>
      <button class="tbtn f1" onclick="clearAll()">&#128465; Clear</button>
    </div>
    <div class="sbar">
      <span class="verlbl">Version:</span>
      <select class="selver" id="ver-d" onchange="loadVersion(this.value)"></select>
      <button class="tbtn" onclick="saveVersion()">&#128190; Save</button>
      <button class="tbtn" onclick="deleteVersion()">&#128465; Del</button>
      <span id="fb-status" style="font-size:10px;color:var(--stx);margin-left:4px;transition:opacity 1.5s;opacity:0"></span>
    </div>
  </div>
</div>
<div class="mob">
  <div class="mhdr">
    <div class="mtop">
      <div class="trow" style="margin-top:0"><span class="tval" id="tv-m">0:00</span><span class="tbadge" id="tbadge-m">over</span></div>
      <div style="display:flex;align-items:center;gap:5px">
        <span class="sdlbl">Set dur.</span>
        <input class="sdinp" id="sd-m" type="text" value="90:00" oninput="updateTimer()" style="width:56px"/>
        <div class="sdwrap" style="width:48px"><div class="sdbar" id="sdb-m" style="width:0%"></div></div>
        <span class="sdpct" id="sdp-m">0%</span>
      </div>
    </div>
    <div class="mtabs">
      <button class="mtab active" id="tab-cat" onclick="switchTab('cat')">&#9835; Catalogue</button>
      <button class="mtab" id="tab-set" onclick="switchTab('set')">&#9776; Setlist</button>
    </div>
  </div>
  <div class="mpanel">
    <div class="mpane active" id="mpane-cat">
      <div class="scroll" id="cat-m"></div>
      <div class="lbar"><button class="tbtn wide" onclick="openAddSong()">+ Add custom song</button></div>
    </div>
    <div class="mpane" id="mpane-set">
      <div class="setarea" id="set-m"></div>
      <div class="tbar">
        <button class="tbtn f1" onclick="addBlock()">&#9654; Break</button>
        <button class="tbtn f1 acc" onclick="exportPDF()">&#128438; PDF</button>
        <button class="tbtn f1" onclick="clearAll()">&#128465; Clear</button>
      </div>
      <div class="sbar">
        <span class="verlbl">Version:</span>
        <select class="selver" id="ver-m" onchange="loadVersion(this.value)"></select>
        <button class="tbtn" onclick="saveVersion()">&#128190; Save</button>
        <button class="tbtn" onclick="deleteVersion()">&#128465; Del</button>
      </div>
    </div>
  </div>
</div>
<div class="modalbg" id="modal" style="display:none">
  <div class="modal"><h3 id="modal-title"></h3><div id="modal-body"></div>
    <div class="mbtns"><button class="mbtn" onclick="closeModal()">Cancel</button><button class="mbtn ok" onclick="confirmModal()">OK</button></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const ALBUMS=[
  {name:"Decision & Action",year:"EP · 2004",tracks:[
    {t:"How To Kill A Feeling And Save A Moment",d:"2:43",tune:"Standard D"},
    {t:"Decision & Action",d:"3:44",tune:"Standard D"},
    {t:"Lindbergh Case",d:"2:48",tune:"Standard D"},
    {t:"The Requiem",d:"3:44",tune:"Drop Ass"},
    {t:"Ghost From The Past",d:"4:33",tune:"Standard D"},
  ]},
  {name:"Crush/Rebuild",year:"Album · 2005",tracks:[
    {t:"Return To The End",d:"3:27",tune:"Standard D"},
    {t:"Fracture",d:"1:45",tune:"Drop C"},
    {t:"The Progress",d:"3:41",tune:"Standard D"},
    {t:"Varnished View",d:"3:29",tune:"Standard D"},
    {t:"Veritas",d:"3:26",tune:"Standard D"},
    {t:"CTRL+ALT+DEL",d:"1:47",tune:"Standard D"},
    {t:"Abyss",d:"3:46",tune:"Standard D"},
    {t:"Type II Supernovae",d:"4:34",tune:"Standard D"},
    {t:"Induced Sleep",d:"3:37",tune:"Standard D"},
    {t:"Dressed In Red",d:"3:44",tune:"Standard D"},
    {t:'There Is No More "Us"',d:"3:46",tune:"Standard D"},
    {t:"With Bare Fists Against Concrete",d:"4:02",tune:"Standard D"},
  ]},
  {name:"I'll Beat You, City!",year:"Album · 2006",tracks:[
    {t:"Being Victimized Is A Two Way Street",d:"1:54",tune:"Standard D"},
    {t:"Bonfire Now",d:"2:53",tune:"Standard D"},
    {t:"One Problem And Counting",d:"3:37",tune:"Standard D"},
    {t:"An Audience Of One",d:"3:46",tune:"Standard D"},
    {t:"Wiretapping With Benefits",d:"3:16",tune:"Standard D"},
    {t:"The City",d:"3:01",tune:"Drop C"},
    {t:"An Ode To Self Defense",d:"2:52",tune:"Standard D"},
    {t:"At Gunpoint, At Stake",d:"2:53",tune:"Standard D"},
    {t:"Three, Two, Square One, Go",d:"2:45",tune:"Standard D"},
    {t:"Deaf Mute Blind Passenger",d:"2:57",tune:"Standard D"},
    {t:"Eight Six It All",d:"4:54",tune:"Standard D"},
    {t:"Duly Noted",d:"2:50",tune:"Standard D"},
  ]},
  {name:"Cum Grano Salis",year:"Album · 2008",tracks:[
    {t:"Electric Arc",d:"2:48",tune:"Standard D"},
    {t:"Senses Riding Shotgun",d:"3:05",tune:"Standard D"},
    {t:"Benchwarmer",d:"3:04",tune:"Standard D"},
    {t:"Sleep! Don't Breath!",d:"3:26",tune:"Standard D"},
    {t:"B.Y.O.O. (Bring Your Own Organs)",d:"3:30",tune:"Standard D"},
    {t:"Fake It Like You Mean It",d:"3:18",tune:"Standard D"},
    {t:"Readapting",d:"3:10",tune:"Standard D"},
    {t:"Cheers to You, Mrs. Ford",d:"3:36",tune:"Standard D"},
    {t:"Gilgamesh, What Have We Done?",d:"1:46",tune:"Standard D"},
    {t:"The Cocoon",d:"2:43",tune:"Standard D"},
    {t:"There's a Leak!",d:"3:37",tune:"Standard D"},
  ]},
  {name:"Fire In The Attic",year:"Album · 2009",tracks:[
    {t:"Are We There Yet?",d:"4:18",tune:"Standard D"},
    {t:"Running With Scissors",d:"2:49",tune:"Standard D"},
    {t:"Wide Eyes",d:"3:23",tune:"Standard D"},
    {t:"Heartbeats for Paychecks",d:"1:28",tune:"Standard D"},
    {t:"Clockworks",d:"3:40",tune:"Standard D"},
    {t:"Emergency Exit",d:"2:45",tune:"Standard D"},
    {t:"The Failure, Pt. I - The Nightmare",d:"3:47",tune:"Standard D"},
    {t:"The Failure, Pt. II - The Hangover",d:"3:00",tune:"Standard D"},
    {t:"A Call Into Arms",d:"3:35",tune:"Standard D"},
    {t:"Sinking (Relation)ship",d:"4:06",tune:"Standard D"},
    {t:"Call It Quits",d:"1:49",tune:"Standard D"},
    {t:"Imperfection Is Infinite",d:"4:09",tune:"Standard D"},
    {t:"Shapeshifting Mountain",d:"3:05",tune:"Standard D"},
  ]},
];
const TUNINGS=["Standard D","Drop C","Drop Ass"];

// ── STATE ───────────────────────────────────────────────────────────────────

var customSongs=[];
var durOverrides={},tuneOverrides={};
var setlist=[],blockCount=0,dragSrcId=null,versions={},activeVer=null,modalCb=null,openAlbums=new Set();

// Firebase
var FB='https://fita-setliste-default-rtdb.europe-west1.firebasedatabase.app';
function fbGet(p){return fetch(FB+p+'.json').then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});}
function fbSet(p,d){return fetch(FB+p+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).catch(function(){});}
function fbDel(p){return fetch(FB+p+'.json',{method:'DELETE'}).catch(function(){});}
function showSt(msg,ok){var el=document.getElementById('fb-status');if(!el)return;el.textContent=msg;el.style.color=ok?'var(--stx)':'var(--dtx)';el.style.opacity=1;clearTimeout(showSt._t);showSt._t=setTimeout(function(){el.style.opacity=0;},2500);}
function saveOvDebounced(){clearTimeout(saveOvDebounced._t);saveOvDebounced._t=setTimeout(function(){fbSet('/overrides',{dur:durOverrides,tune:tuneOverrides}).then(function(){showSt('OK Saved',true);});},800);}

// Helpers
function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36);}
function ps(d){if(!d||d.indexOf(':')<0)return 0;var p=d.split(':');return +p[0]*60+ +p[1];}
function ft(s){var m=Math.floor(s/60),sc=s%60;return m+':'+(sc<10?'0':'')+sc;}
function isSel(t){return setlist.some(function(x){return x.type==='song'&&x.title===t;});}
function getDur(t){return durOverrides[t]||_trackField(t,'d')||'0:00';}
function getTune(t){return tuneOverrides[t]||_trackField(t,'tune')||'Standard D';}
function _trackField(title,field){
  for(var i=0;i<ALBUMS.length;i++)for(var j=0;j<ALBUMS[i].tracks.length;j++)if(ALBUMS[i].tracks[j].t===title)return ALBUMS[i].tracks[j][field];
  for(var k=0;k<customSongs.length;k++)if(customSongs[k].t===title)return customSongs[k][field];
  return null;
}
function tuneClass(t){if(!t)return'stdd';if(t==='Drop Ass')return'tdass';if(t.indexOf('Drop')>=0||t.indexOf('drop')>=0)return'tdrop';return'stdd';}

// Tab switch
function switchTab(tab){
  document.getElementById('tab-cat').classList.toggle('active',tab==='cat');
  document.getElementById('tab-set').classList.toggle('active',tab==='set');
  document.getElementById('mpane-cat').classList.toggle('active',tab==='cat');
  document.getElementById('mpane-set').classList.toggle('active',tab==='set');
}

// Modal
function openModal(title,html,cb){
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-body').innerHTML=html;
  modalCb=cb;document.getElementById('modal').style.display='flex';
  var f=document.querySelector('#modal-body input,#modal-body select');
  if(f)setTimeout(function(){f.focus();},50);
  document.onkeydown=function(e){if(e.key==='Enter')confirmModal();if(e.key==='Escape')closeModal();};
}
function closeModal(){document.getElementById('modal').style.display='none';modalCb=null;document.onkeydown=null;}
function confirmModal(){if(modalCb)modalCb();closeModal();}

// Edit meta
function editDurCat(title){
  var cur=getDur(title);
  openModal('Duration for "'+title+'"','<label>Duration (mm:ss)</label><input id="mi-v" value="'+cur+'"/>',function(){
    var v=document.getElementById('mi-v').value.trim();if(!v||v.indexOf(':')<0)return;
    durOverrides[title]=v;saveOvDebounced();render();
  });
}
function editTuneCat(title){
  var cur=getTune(title);
  openModal('Tuning for "'+title+'"',
    '<label>Tuning</label><select id="mi-v"><option>Standard D</option><option>Drop C</option><option>Drop Ass</option><option>E Std</option><option>Drop D</option></select>',
    function(){var v=document.getElementById('mi-v').value;tuneOverrides[title]=v;saveOvDebounced();render();});
  setTimeout(function(){var s=document.getElementById('mi-v');if(s)s.value=cur;},60);
}
function editDurSet(id){
  var item=null;for(var i=0;i<setlist.length;i++)if(setlist[i].id===id){item=setlist[i];break;}
  if(!item)return;
  openModal('Duration','<label>Duration (mm:ss)</label><input id="mi-v" value="'+item.dur+'"/>',function(){
    var v=document.getElementById('mi-v').value.trim();if(!v||v.indexOf(':')<0)return;
    durOverrides[item.title]=v;item.dur=v;saveOvDebounced();render();
  });
}
function editBL(id){
  var item=null;for(var i=0;i<setlist.length;i++)if(setlist[i].id===id){item=setlist[i];break;}
  if(!item)return;
  openModal('Rename break','<input id="mi-v" value="'+(item.label||'Break')+'"/>',function(){
    var v=document.getElementById('mi-v').value.trim();if(!v)return;item.label=v;rb();
  });
}
function editBP(id){
  var item=null;for(var i=0;i<setlist.length;i++)if(setlist[i].id===id){item=setlist[i];break;}
  if(!item)return;
  openModal('Pause duration','<input id="mi-v" value="'+(item.pause||'3:00')+'"/>',function(){
    var v=document.getElementById('mi-v').value.trim();if(!v)return;
    item.pause=v.indexOf(':')>=0?v:(parseInt(v)||3)+':00';rb();updateTimer();
  });
}
function openAddSong(){
  openModal('Add custom song',
    '<label>Title</label><input id="mi-t" placeholder="Song title"/><label>Duration</label><input id="mi-d" placeholder="3:30"/><label>Tuning</label><select id="mi-tune"><option>Standard D</option><option>Drop C</option><option>Drop Ass</option></select>',
    function(){
      var t=document.getElementById('mi-t').value.trim();if(!t)return;
      var d=document.getElementById('mi-d').value.trim()||'3:00';
      var tune=document.getElementById('mi-tune').value;
      customSongs.push({t:t,d:d,tune:tune});render();
    });
}

// Build catalogue
function buildCat(id){
  var el=document.getElementById(id);if(!el)return;el.innerHTML='';
  var groups=ALBUMS.slice();
  if(customSongs.length)groups.push({name:'Custom',year:'',tracks:customSongs});
  groups.forEach(function(grp){
    var isOpen=openAlbums.has(grp.name);
    var selCount=0;for(var i=0;i<grp.tracks.length;i++)if(isSel(grp.tracks[i].t))selCount++;
    var wrap=document.createElement('div');wrap.className='ag';
    var hdr=document.createElement('div');hdr.className='ah';
    hdr.innerHTML='<div class="ai"><span class="an">'+grp.name+'</span><span class="ay">'+grp.year+'</span>'+
      '<span class="ac2'+(selCount?' hs':'')+'\">'+(selCount?selCount+'/':'')+grp.tracks.length+' songs</span></div>'+
      '<span class="achev">'+(isOpen?'&#9660;':'&#9658;')+'</span>';
    (function(g){hdr.onclick=function(){if(openAlbums.has(g.name))openAlbums.delete(g.name);else openAlbums.add(g.name);buildCat(id);};})(grp);
    wrap.appendChild(hdr);
    var tracks=document.createElement('div');tracks.className='at'+(isOpen?' open':'');
    grp.tracks.forEach(function(tr){
      var sel=isSel(tr.t);
      var dur=getDur(tr.t);
      var tune=getTune(tr.t);
      var row=document.createElement('div');row.className='si'+(sel?' sel':'');
      row.innerHTML='<div class="abtn">'+(sel?'&#10005;':'+')+'</div>'+
        '<span class="sttlc" title="'+tr.t+'">'+tr.t+'</span>'+
        '<span class="smeta">'+
        '<span class="sdur-c" title="Edit duration" onclick="event.stopPropagation();editDurCat(this.closest(\'[data-t]\').dataset.t)">'+dur+'</span>'+
        '<span class="stune-c '+tuneClass(tune)+'" title="Edit tuning" onclick="event.stopPropagation();editTuneCat(this.closest(\'[data-t]\').dataset.t)">'+tune+'</span>'+
        '</span>';
      row.dataset.t=tr.t;
      (function(title,d,album){row.onclick=function(){toggleSong(title,d,tune,album);};})(tr.t,dur,grp.name);
      tracks.appendChild(row);
    });
    wrap.appendChild(tracks);el.appendChild(wrap);
  });
}

// Toggle song
function toggleSong(title,dur,tune,album){
  if(isSel(title)){setlist=setlist.filter(function(x){return!(x.type==='song'&&x.title===title);});}
  else{setlist.push({type:'song',title:title,dur:getDur(title),tune:getTune(title),album:album,id:uid()});}
  render();
}

// Timer
function updateTimer(){
  var s=0;for(var i=0;i<setlist.length;i++){if(setlist[i].type==='song')s+=ps(setlist[i].dur);if(setlist[i].type==='block')s+=ps(setlist[i].pause||'3:00');}
  ['d','m'].forEach(function(sfx){
    var tv=document.getElementById('tv-'+sfx);if(!tv)return;
    var ob=document.getElementById('tbadge-'+sfx);
    var inp=document.getElementById('sd-'+sfx);
    var ts=ps(inp?inp.value:'90:00');
    tv.textContent=ft(s);
    if(ts>0){
      var over=s>ts,ratio=Math.min(s/ts,1);
      document.getElementById('sdb-'+sfx).style.width=(ratio*100)+'%';
      document.getElementById('sdb-'+sfx).className='sdbar'+(s>ts*0.95&&!over?' warn':over?' over':'');
      document.getElementById('sdp-'+sfx).textContent=Math.round(s/ts*100)+'%';
      tv.classList.toggle('over',over);ob.classList.toggle('show',over);
    }else{document.getElementById('sdb-'+sfx).style.width='0%';document.getElementById('sdp-'+sfx).textContent='';tv.classList.remove('over');ob.classList.remove('show');}
  });
}

// Desktop drag
function addDrag(el,item){
  el.addEventListener('dragstart',function(e){dragSrcId=item.id;setTimeout(function(){el.classList.add('dragging');},0);e.dataTransfer.effectAllowed='move';});
  el.addEventListener('dragend',function(){el.classList.remove('dragging');document.querySelectorAll('.dot,.dob').forEach(function(x){x.classList.remove('dot','dob');});});
  el.addEventListener('dragover',function(e){e.preventDefault();document.querySelectorAll('.dot,.dob').forEach(function(x){x.classList.remove('dot','dob');});var mid=el.getBoundingClientRect().top+el.getBoundingClientRect().height/2;el.classList.add(e.clientY<mid?'dot':'dob');});
  el.addEventListener('dragleave',function(){el.classList.remove('dot','dob');});
  el.addEventListener('drop',function(e){
    e.preventDefault();el.classList.remove('dot','dob');
    if(!dragSrcId||dragSrcId===item.id)return;
    var fi=-1,ti=-1;
    for(var i=0;i<setlist.length;i++){if(setlist[i].id===dragSrcId)fi=i;if(setlist[i].id===item.id)ti=i;}
    if(fi<0||ti<0)return;
    var after=e.clientY>=el.getBoundingClientRect().top+el.getBoundingClientRect().height/2;
    var moved=setlist.splice(fi,1)[0];
    var ni=-1;for(var j=0;j<setlist.length;j++)if(setlist[j].id===item.id){ni=j;break;}
    setlist.splice(after?ni+1:ni,0,moved);dragSrcId=null;render();
  });
}

// Build setlist
function buildSet(id){
  var sl=document.getElementById(id);if(!sl)return;sl.innerHTML='';
  if(!setlist.length){sl.innerHTML='<div class="empty"><span style="font-size:32px;opacity:.2">&#9835;</span><span>Click songs on the left to build your setlist</span></div>';return;}
  var sn=0,prevTune=null;
  for(var i=0;i<setlist.length;i++){
    var item=setlist[i];
    if(item.type==='block'){
      var el=document.createElement('div');el.className='bi';el.draggable=true;el.dataset.id=item.id;
      el.innerHTML='<span class="bgh">&#8942;</span><div class="bline"></div>'+
        '<span class="blabel" onclick="editBL(\''+item.id+'\')">'+(item.label||'Break')+'</span>'+
        '<span class="bpause" onclick="editBP(\''+item.id+'\')">&#9749; '+(item.pause||'3:00')+'</span>'+
        '<div class="bline"></div><button class="srm" onclick="removeById(\''+item.id+'\')">&#10005;</button>';
      addDrag(el,item);sl.appendChild(el);prevTune=null;
    }else{
      sn++;
      item.dur=getDur(item.title);item.tune=getTune(item.title);
      var retune=prevTune&&prevTune!==item.tune;prevTune=item.tune;
      var el=document.createElement('div');el.className='sitem';el.draggable=true;el.dataset.id=item.id;
      el.innerHTML='<span class="gh">&#8942;</span>'+
        '<span class="snum">'+sn+'</span>'+
        '<span class="sttl" title="'+item.title+'">'+item.title+'</span>'+
        (retune?'<span class="rtbadge">retune</span>':'')+
        '<span class="stune-s '+tuneClass(item.tune)+'">'+item.tune+'</span>'+
        '<span class="sdur-s" onclick="editDurSet(\''+item.id+'\')" title="Edit">'+item.dur+'</span>'+
        '<button class="srm" onclick="removeById(\''+item.id+'\')">&#10005;</button>';
      addDrag(el,item);sl.appendChild(el);
    }
  }
}

function rb(){buildSet('set-d');buildSet('set-m');}
function render(){buildCat('cat-d');buildCat('cat-m');buildSet('set-d');buildSet('set-m');updateTimer();}
function removeById(id){setlist=setlist.filter(function(x){return x.id!==id;});render();}
function addBlock(){blockCount++;setlist.push({type:'block',num:blockCount,label:'Break',pause:'3:00',id:uid()});rb();updateTimer();}
function clearAll(){setlist=[];blockCount=0;render();}

// Versions
function refreshVers(){
  var opts='<option value="">-- unsaved --</option>'+Object.keys(versions).map(function(k){return'<option value="'+k+'"'+(k===activeVer?' selected':'')+'>'+k+'</option>';}).join('');
  ['ver-d','ver-m'].forEach(function(id){var el=document.getElementById(id);if(el)el.innerHTML=opts;});
  var t=activeVer||'Setlist';
  var el=document.getElementById('setlist-title');if(el)el.textContent=t;
}
function saveVersion(){
  openModal('Save version as','<input id="mi-v" value="'+(activeVer||'Setlist '+(Object.keys(versions).length+1))+'"/>',function(){
    var name=document.getElementById('mi-v').value.trim();if(!name)return;
    var data=JSON.parse(JSON.stringify({setlist:setlist,blockCount:blockCount,durOverrides:durOverrides,tuneOverrides:tuneOverrides,customSongs:customSongs}));
    versions[name]=data;activeVer=name;refreshVers();
    fbSet('/versions/'+encodeURIComponent(name),data).then(function(){showSt('OK Saved',true);});
  });
}
function loadVersion(name){
  if(!name||!versions[name])return;
  var v=versions[name];
  setlist=JSON.parse(JSON.stringify(v.setlist));
  blockCount=v.blockCount||0;
  durOverrides=v.durOverrides||{};
  tuneOverrides=v.tuneOverrides||{};
  customSongs=v.customSongs||[];
  activeVer=name;refreshVers();render();
}
function deleteVersion(){
  var sel=(document.getElementById('ver-d')||{}).value||(document.getElementById('ver-m')||{}).value||'';
  if(!sel||!versions[sel])return;
  delete versions[sel];if(activeVer===sel)activeVer=null;refreshVers();
  fbDel('/versions/'+encodeURIComponent(sel)).then(function(){showSt('OK Deleted',true);});
}

// PDF
function exportPDF(){
  var jsPDF=(window.jspdf&&window.jspdf.jsPDF)||window.jsPDF;
  if(!jsPDF){alert('PDF library loading - try again.');return;}
  var doc=new jsPDF({unit:'mm',format:'a4'});
  var PW=210,ML=18,MR=18,y=22;
  doc.setFillColor(26,26,46);doc.rect(0,0,PW,16,'F');
  doc.setTextColor(240,240,240);doc.setFontSize(13);doc.setFont('helvetica','bold');
  doc.text('FIRE IN THE ATTIC  -  '+(activeVer||'SETLIST'),ML,11);
  var tot=0;for(var i=0;i<setlist.length;i++){if(setlist[i].type==='song')tot+=ps(setlist[i].dur);if(setlist[i].type==='block')tot+=ps(setlist[i].pause||'3:00');}
  doc.setFontSize(10);doc.setFont('helvetica','normal');doc.text('Total: '+ft(tot),PW-MR,11,{align:'right'});
  var sn=0,prevTune=null;
  for(var i=0;i<setlist.length;i++){
    var item=setlist[i];if(y>277){doc.addPage();y=18;}
    if(item.type==='block'){
      y+=3;doc.setDrawColor(160,160,160);doc.setLineWidth(0.3);doc.line(ML,y,PW-MR,y);
      doc.setFontSize(9);doc.setFont('helvetica','bold');doc.setTextColor(100,100,120);
      doc.text((item.label||'Break')+' - pause '+(item.pause||'3:00'),PW/2,y-1,{align:'center'});
      y+=6;prevTune=null;
    }else{
      sn++;
      var retune=prevTune&&prevTune!==item.tune;prevTune=item.tune;
      if(sn%2===0){doc.setFillColor(245,245,248);doc.rect(ML-2,y-4,PW-ML-MR+4,7,'F');}
      doc.setFontSize(10);doc.setFont('helvetica','bold');doc.setTextColor(30,30,50);
      doc.text(String(sn)+'.',ML,y);doc.setFont('helvetica','normal');
      var maxW=PW-ML-MR-7-24;var title=item.title;
      while(doc.getTextWidth(title)>maxW&&title.length>8)title=title.slice(0,-2);
      if(title!==item.title)title=title.trim()+'...';
      doc.text(title,ML+7,y);
      if(retune){doc.setTextColor(200,140,0);doc.setFontSize(7);doc.text('retune',PW-MR-30,y);}
      doc.setTextColor(80,120,80);doc.setFontSize(8);doc.text(item.tune,PW-MR-20,y);
      doc.setTextColor(120,120,130);doc.text(item.dur,PW-MR,y,{align:'right'});
      y+=7;
    }
  }
  y+=6;doc.setDrawColor(200,200,200);doc.setLineWidth(0.3);doc.line(ML,y,PW-MR,y);
  doc.setFontSize(8);doc.setTextColor(150,150,150);doc.setFont('helvetica','italic');
  doc.text('Generated '+new Date().toLocaleDateString('de-DE')+' - '+ft(tot)+' total',ML,y+5);
  doc.save('FITA_Setlist.pdf');
}

render();
Promise.all([fbGet('/overrides'),fbGet('/versions')]).then(function(results){
  var ov=results[0],vs=results[1];
  if(ov){if(ov.dur)Object.assign(durOverrides,ov.dur);if(ov.tune)Object.assign(tuneOverrides,ov.tune);}

  else{render();}
  showSt('OK Connected',true);
}).catch(function(){showSt('offline',false);});

// Touch Drag & Drop (long press 500ms to drag, any movement cancels to scroll)
(function(){
  var dragEl=null,dragItem=null,lastTarget=null,pressTimer=null,isDragging=false;
  var startX=0,startY=0;
  var THRESHOLD=8; // pixels of movement that cancels drag intent
  var DELAY=500;   // ms hold before drag starts

  function getRow(el){
    while(el){if(el.dataset&&el.dataset.id)return el;el=el.parentElement;}
    return null;
  }
  function clearDots(){
    document.querySelectorAll('.dot,.dob').forEach(function(x){x.classList.remove('dot','dob');});
  }
  function cancelPress(){
    clearTimeout(pressTimer);pressTimer=null;
    isDragging=false;
    if(dragEl){dragEl.style.opacity='';dragEl.style.boxShadow='';}
    dragEl=null;dragItem=null;
  }

  function onTouchStart(e){
    var row=getRow(e.target);if(!row)return;
    if(e.target.tagName==='BUTTON'||e.target.closest('button'))return;
    startX=e.touches[0].clientX;
    startY=e.touches[0].clientY;
    isDragging=false;
    pressTimer=setTimeout(function(){
      // Only start drag if finger hasn't moved significantly
      isDragging=true;dragEl=row;dragItem=null;
      for(var i=0;i<setlist.length;i++){
        if(setlist[i].id===row.dataset.id){dragItem=setlist[i];break;}
      }
      if(!dragItem){isDragging=false;dragEl=null;return;}
      row.style.opacity='0.4';
      row.style.boxShadow='0 4px 16px rgba(0,0,0,0.4)';
    },DELAY);
  }

  function onTouchMove(e){
    if(!pressTimer&&!isDragging)return;
    var t=e.touches[0];
    var dx=Math.abs(t.clientX-startX);
    var dy=Math.abs(t.clientY-startY);

    // If finger moved more than threshold and we haven't started dragging yet -> cancel, let scroll happen
    if(!isDragging){
      if(dx>THRESHOLD||dy>THRESHOLD){
        clearTimeout(pressTimer);pressTimer=null;
      }
      return; // don't prevent default - allow scroll
    }

    // We are dragging - prevent scroll
    e.preventDefault();
    var el=document.elementFromPoint(t.clientX,t.clientY);
    var row=getRow(el);
    clearDots();
    if(row&&row!==dragEl){
      lastTarget=row;
      var rect=row.getBoundingClientRect();
      row.classList.add(t.clientY<rect.top+rect.height/2?'dot':'dob');
    }
  }

  function onTouchEnd(e){
    clearTimeout(pressTimer);pressTimer=null;
    if(!isDragging||!dragEl){isDragging=false;return;}
    dragEl.style.opacity='';dragEl.style.boxShadow='';
    clearDots();
    if(lastTarget&&lastTarget!==dragEl){
      var t=e.changedTouches[0];
      var fi=-1,ni=-1;
      for(var i=0;i<setlist.length;i++){if(setlist[i].id===dragItem.id)fi=i;}
      if(fi>=0){
        var moved=setlist.splice(fi,1)[0];
        var rect=lastTarget.getBoundingClientRect();
        var after=t.clientY>=rect.top+rect.height/2;
        for(var j=0;j<setlist.length;j++){if(setlist[j].id===lastTarget.dataset.id){ni=j;break;}}
        setlist.splice(after?ni+1:ni,0,moved);
        render();
      }
    }
    dragEl=null;dragItem=null;lastTarget=null;isDragging=false;
  }

  function onTouchCancel(){
    cancelPress();clearDots();lastTarget=null;
  }

  function attach(id){
    var el=document.getElementById(id);if(!el)return;
    // Remove old listeners if any
    if(el._touch_attached)return;
    el._touch_attached=true;
    el.addEventListener('touchstart',onTouchStart,{passive:true});
    el.addEventListener('touchmove',onTouchMove,{passive:false});
    el.addEventListener('touchend',onTouchEnd,{passive:false});
    el.addEventListener('touchcancel',onTouchCancel,{passive:true});
  }

  function attachAll(){attach('set-d');attach('set-m');}
  setTimeout(attachAll,300);

  // Re-attach after render via MutationObserver
  var obs=new MutationObserver(function(){
    ['set-d','set-m'].forEach(function(id){
      var el=document.getElementById(id);
      if(el){el._touch_attached=false;attach(id);}
    });
  });
  setTimeout(function(){
    ['set-d','set-m'].forEach(function(id){
      var el=document.getElementById(id);
      if(el)obs.observe(el,{childList:true});
    });
  },400);
})();
